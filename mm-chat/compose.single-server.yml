name: mm-chat

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

x-mcp-runner-build: &mcp-runner-build
  context: ./backend
  dockerfile: Dockerfile
  target: mcp-runner

x-rag-build: &rag-build
  context: ./rag
  dockerfile: Dockerfile

x-frontend-build: &frontend-build
  context: ./frontend
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_API_MODE: server
    NEXT_PUBLIC_API_BASE_URL: /mm-api
    MM_CHAT_BACKEND_INTERNAL_URL: http://backend:8080

x-postgres-build: &postgres-build
  context: ./postgres
  dockerfile: Dockerfile

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-neo_chat}
  POSTGRES_USER: ${POSTGRES_USER:-neo_chat_migrator}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-migrator-postgres}

x-redis-env: &redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}

x-minio-root-env: &minio-root-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-root}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-root-secret}

x-minio-app-env: &minio-app-env
  S3_BUCKET: ${S3_BUCKET:-neo-chat-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mm-chat-files}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-user-secret}

x-frontend-env: &frontend-env
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_API_MODE: server
  NEXT_PUBLIC_API_BASE_URL: /mm-api
  MM_CHAT_BACKEND_INTERNAL_URL: http://backend:8080
  AUTH_MODE: ${AUTH_MODE:-required}
  BYOK_PRIVATE_KEY_PEM: ${BYOK_PRIVATE_KEY_PEM:-}
  BYOK_KEY_ID: ${BYOK_KEY_ID:-}
  BYOK_ALLOW_EPHEMERAL_KEY: ${BYOK_ALLOW_EPHEMERAL_KEY:-true}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
  ALLOW_LOCAL_NETWORK_PROXY: ${ALLOW_LOCAL_NETWORK_PROXY:-}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

x-backend-env: &backend-env
  MM_CHAT_ADDR: ${MM_CHAT_ADDR:-:8080}
  MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
  DATABASE_URL: ${DATABASE_URL:-postgres://neo_chat_api:change-me-api-postgres@postgres:5432/neo_chat?sslmode=disable}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
  REDIS_URL: ${REDIS_URL:-redis://:change-me-redis@redis:6379/0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mm-chat}
  REDIS_RUN_CANCEL_TTL: ${REDIS_RUN_CANCEL_TTL:-10m}
  REDIS_SESSION_CACHE_TTL: ${REDIS_SESSION_CACHE_TTL:-5m}
  REDIS_RATE_LIMIT_ENABLED: ${REDIS_RATE_LIMIT_ENABLED:-true}
  REDIS_RATE_LIMIT_REQUESTS: ${REDIS_RATE_LIMIT_REQUESTS:-120}
  REDIS_RATE_LIMIT_WINDOW: ${REDIS_RATE_LIMIT_WINDOW:-1m}
  AUTH_MODE: ${AUTH_MODE:-required}
  AUTH_BOOTSTRAP_USER_ID: ${AUTH_BOOTSTRAP_USER_ID:-00000000-0000-0000-0000-000000000001}
  AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-Owner}
  AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
  AUTH_RECOVERY_TTL: ${AUTH_RECOVERY_TTL:-30m}
  AUTH_SMTP_ADDR: ${AUTH_SMTP_ADDR:-}
  AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
  AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
  AUTH_SMTP_FROM: ${AUTH_SMTP_FROM:-}
  AUTH_SMTP_QUEUE_SIZE: ${AUTH_SMTP_QUEUE_SIZE:-100}
  AUTH_SMTP_TIMEOUT: ${AUTH_SMTP_TIMEOUT:-10s}
  TEAM_CURSOR_ACTIVE_KEY_ID: ${TEAM_CURSOR_ACTIVE_KEY_ID:-local-dev}
  TEAM_CURSOR_KEYRING: "${TEAM_CURSOR_KEYRING:-local-dev=bW0tY2hhdC1sb2NhbC1kZXYtY3Vyc29yLWtleS0zMi1ieXRlcw==}"
  TEAM_MAIL_ACTIVE_KEY_ID: ${TEAM_MAIL_ACTIVE_KEY_ID:-}
  TEAM_MAIL_KEYRING: "${TEAM_MAIL_KEYRING:-}"
  TEAM_INVITE_ACCEPT_URL_BASE: ${TEAM_INVITE_ACCEPT_URL_BASE:-}
  TEAM_MAIL_WORKER_LEASE_DURATION: ${TEAM_MAIL_WORKER_LEASE_DURATION:-30s}
  TEAM_MAIL_WORKER_POLL_INTERVAL: ${TEAM_MAIL_WORKER_POLL_INTERVAL:-500ms}
  TEAM_MAIL_WORKER_BACKOFF_BASE: ${TEAM_MAIL_WORKER_BACKOFF_BASE:-5s}
  TEAM_MAIL_WORKER_BACKOFF_MAX: ${TEAM_MAIL_WORKER_BACKOFF_MAX:-15m}
  PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-2m}
  PROVIDER_SECRET_KEYRING_FILE: /run/secrets/mm_chat_provider_keyring
  BYOK_PRIVATE_KEY_PEM: ${BYOK_PRIVATE_KEY_PEM:-}
  BYOK_KEY_ID: ${BYOK_KEY_ID:-}
  BYOK_ALLOW_EPHEMERAL_KEY: ${BYOK_ALLOW_EPHEMERAL_KEY:-true}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-./data/files}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-neo-chat-files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mm-chat-files}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-user-secret}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_BUCKET_AUTO_CREATE: ${S3_BUCKET_AUTO_CREATE:-false}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  RAG_SOURCE_GATEWAY_TOKEN: ${RAG_SOURCE_GATEWAY_TOKEN:-}
  MEMORY_LEXICAL_SHADOW_ENABLED: ${MEMORY_LEXICAL_SHADOW_ENABLED:-false}
  MEMORY_HYBRID_SHADOW_ENABLED: ${MEMORY_HYBRID_SHADOW_ENABLED:-false}
  MEMORY_TOOL_LOOP_ENABLED: ${MEMORY_TOOL_LOOP_ENABLED:-false}
  MEMORY_TOOL_LOOP_CANARY_USER_IDS: ${MEMORY_TOOL_LOOP_CANARY_USER_IDS:-}
  MEMORY_L2_SCENE_SHADOW_ENABLED: ${MEMORY_L2_SCENE_SHADOW_ENABLED:-false}
  MEMORY_L2_SCENE_READER_ENABLED: ${MEMORY_L2_SCENE_READER_ENABLED:-false}
  MEMORY_L3_PERSONA_SHADOW_ENABLED: ${MEMORY_L3_PERSONA_SHADOW_ENABLED:-false}
  MEMORY_L3_PERSONA_READER_ENABLED: ${MEMORY_L3_PERSONA_READER_ENABLED:-false}
  MCP_ENABLED: ${MCP_ENABLED:-false}
  MCP_REMOTE_ENABLED: ${MCP_REMOTE_ENABLED:-true}
  MCP_STDIO_ENABLED: ${MCP_STDIO_ENABLED:-false}
  MCP_MANIFEST_FILE: /etc/mm-chat/mcp-manifest.json
  MCP_RUNNER_URL: ${MCP_RUNNER_URL:-http://mcp-runner:8090}
  MCP_RUNNER_TOKEN_FILE: /run/secrets/mm_chat_mcp_runner_token
  MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-}
  MCP_PRIVATE_SERVER_LIMIT: ${MCP_PRIVATE_SERVER_LIMIT:-20}
  MCP_CONVERSATION_SERVER_LIMIT: ${MCP_CONVERSATION_SERVER_LIMIT:-8}
  MCP_MAX_EXPOSED_TOOLS: ${MCP_MAX_EXPOSED_TOOLS:-32}
  MCP_MAX_CALLS_PER_RUN: ${MCP_MAX_CALLS_PER_RUN:-32}
  MCP_MAX_ROUNDS_PER_RUN: ${MCP_MAX_ROUNDS_PER_RUN:-8}
  MCP_MAX_CONCURRENT_PER_USER: ${MCP_MAX_CONCURRENT_PER_USER:-4}
  MCP_MAX_PENDING_OAUTH_FLOWS: ${MCP_MAX_PENDING_OAUTH_FLOWS:-5}
  MCP_CALL_TIMEOUT: ${MCP_CALL_TIMEOUT:-30s}
  MCP_RUN_TIMEOUT: ${MCP_RUN_TIMEOUT:-120s}
  MCP_AUDIT_RETENTION: ${MCP_AUDIT_RETENTION:-2160h}
  MCP_CLEANUP_INTERVAL: ${MCP_CLEANUP_INTERVAL:-1h}
  MCP_MARKETPLACE_ENABLED: ${MCP_MARKETPLACE_ENABLED:-false}
  MCP_MARKETPLACE_BASE_URL: ${MCP_MARKETPLACE_BASE_URL:-https://market.lobehub.com}
  MCP_MARKETPLACE_CLIENT_ID: ${MCP_MARKETPLACE_CLIENT_ID:-}
  MCP_MARKETPLACE_CLIENT_SECRET_FILE: /run/secrets/mm_chat_mcp_marketplace_client_secret
  MCP_MARKETPLACE_TIMEOUT: ${MCP_MARKETPLACE_TIMEOUT:-8s}
  MCP_MARKETPLACE_CACHE_TTL: ${MCP_MARKETPLACE_CACHE_TTL:-5m}
  AGENT_LOCAL_RUNTIME_ENABLED: ${AGENT_LOCAL_RUNTIME_ENABLED:-true}
  AGENT_LOCAL_RUNTIME_ROOT: ${AGENT_LOCAL_RUNTIME_ROOT:-/var/lib/mm-chat/agent-skills}
  AGENT_LOCAL_WORKSPACE_ROOT: ${AGENT_LOCAL_WORKSPACE_ROOT:-/workspace}
  AGENT_LOCAL_SHELL: ${AGENT_LOCAL_SHELL:-/bin/bash}
  AGENT_LOCAL_APPROVAL_MODE: ${AGENT_LOCAL_APPROVAL_MODE:-smart}
  AGENT_LOCAL_CALL_TIMEOUT: ${AGENT_LOCAL_CALL_TIMEOUT:-30s}
  AGENT_LOCAL_RUN_TIMEOUT: ${AGENT_LOCAL_RUN_TIMEOUT:-5m}
  AGENT_LOCAL_MAX_OUTPUT_BYTES: ${AGENT_LOCAL_MAX_OUTPUT_BYTES:-1048576}
  AGENT_LOCAL_MAX_CALLS_PER_RUN: ${AGENT_LOCAL_MAX_CALLS_PER_RUN:-32}
  AGENT_LOCAL_MAX_ROUNDS_PER_RUN: ${AGENT_LOCAL_MAX_ROUNDS_PER_RUN:-8}
  AGENT_LOCAL_MAX_CONCURRENT: ${AGENT_LOCAL_MAX_CONCURRENT:-2}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-mm-chat/postgres:17.10-pg_textsearch1.3.1-pgvector0.8.5}
    build: *postgres-build
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    environment: *postgres-env
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres17}:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
      - rag-private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment: *redis-env
    command:
      - sh
      - -euc
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private
      - rag-private

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    environment: *minio-root-env
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - private

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    environment:
      <<: [*minio-root-env, *minio-app-env]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio" >&2
          sleep 2
        done

        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/mm-chat-files-policy.json <<EOF_POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject"
              ],
              "Resource": [
                "arn:aws:s3:::$$S3_BUCKET",
                "arn:aws:s3:::$$S3_BUCKET/*"
              ]
            }
          ]
        }
        EOF_POLICY
        if ! mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"; then
          mc admin user enable local "$$S3_ACCESS_KEY_ID"
        fi

        if ! mc admin policy create local mm-chat-files /tmp/mm-chat-files-policy.json; then
          mc admin policy info local mm-chat-files >/dev/null
        fi
        mc admin policy attach local mm-chat-files --user "$$S3_ACCESS_KEY_ID"

        mc alias set app http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null
        printf 'mm-chat init check' > /tmp/mm-chat-init-check.txt
        mc cp /tmp/mm-chat-init-check.txt "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
        mc stat "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
        mc rm "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
    networks:
      - private

  backend:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: unless-stopped
    profiles: ["app"]
    init: true
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    environment: *backend-env
    secrets:
      - source: mm_chat_provider_keyring
        target: mm_chat_provider_keyring
      - source: mm_chat_mcp_runner_token
        target: mm_chat_mcp_runner_token
      - source: mm_chat_mcp_marketplace_client_secret
        target: mm_chat_mcp_marketplace_client_secret
    volumes:
      - ./mcp/manifest.json:/etc/mm-chat/mcp-manifest.json:ro
      - type: bind
        source: ${AGENT_LOCAL_RUNTIME_SOURCE:-./data/agent-skills}
        target: ${AGENT_LOCAL_RUNTIME_ROOT:-/var/lib/mm-chat/agent-skills}
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_LOCAL_WORKSPACE_SOURCE:-./data/agent-workspace}
        target: ${AGENT_LOCAL_WORKSPACE_ROOT:-/workspace}
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - private
      - rag-private
      - mcp-control

  mcp-runner:
    image: ${MCP_RUNNER_IMAGE:-mm-chat/mcp-runner:local}
    build: *mcp-runner-build
    restart: unless-stopped
    profiles: ["mcp-runner"]
    init: true
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      # Docker tmpfs defaults to noexec. Dynamic npm package bins must execute
      # from this isolated mount; retain nosuid/nodev and all container fences.
      - /work:rw,exec,nosuid,nodev,size=512m,mode=0700,uid=${MM_CHAT_RUNTIME_UID:-1000},gid=${MM_CHAT_RUNTIME_GID:-1000}
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
      MCP_MANIFEST_FILE: /etc/mm-chat/mcp-manifest.json
      MCP_RUNNER_TOKEN_FILE: /run/secrets/mm_chat_mcp_runner_token
      MCP_RUNNER_ADDR: :8090
    secrets:
      - source: mm_chat_mcp_runner_token
        target: mm_chat_mcp_runner_token
    volumes:
      - ./mcp/manifest.json:/etc/mm-chat/mcp-manifest.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - mcp-control
      - mcp-egress

  memory-worker:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: unless-stopped
    profiles: ["memory-worker"]
    init: true
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    environment:
      MEMORY_WORKER_DATABASE_URL: ${MEMORY_WORKER_DATABASE_URL:-postgres://memory_worker:change-me-memory-worker-postgres@postgres:5432/neo_chat?sslmode=disable}
      MEMORY_WORKER_MAX_OPEN_CONNS: ${MEMORY_WORKER_MAX_OPEN_CONNS:-4}
      MEMORY_WORKER_MAX_IDLE_CONNS: ${MEMORY_WORKER_MAX_IDLE_CONNS:-2}
      MEMORY_WORKER_CONN_MAX_LIFETIME: ${MEMORY_WORKER_CONN_MAX_LIFETIME:-30m}
      MEMORY_WORKER_CONCURRENCY: ${MEMORY_WORKER_CONCURRENCY:-2}
      MEMORY_WORKER_LEASE_DURATION: ${MEMORY_WORKER_LEASE_DURATION:-2m}
      MEMORY_WORKER_POLL_INTERVAL: ${MEMORY_WORKER_POLL_INTERVAL:-1s}
      MEMORY_WORKER_BACKOFF_BASE: ${MEMORY_WORKER_BACKOFF_BASE:-5s}
      MEMORY_WORKER_BACKOFF_MAX: ${MEMORY_WORKER_BACKOFF_MAX:-15m}
      MEMORY_HYBRID_SHADOW_ENABLED: ${MEMORY_HYBRID_SHADOW_ENABLED:-false}
      MEMORY_L2_SCENE_SHADOW_ENABLED: ${MEMORY_L2_SCENE_SHADOW_ENABLED:-false}
      MEMORY_L3_PERSONA_SHADOW_ENABLED: ${MEMORY_L3_PERSONA_SHADOW_ENABLED:-false}
      PROVIDER_TIMEOUT: ${MEMORY_WORKER_PROVIDER_TIMEOUT:-45s}
      PROVIDER_SECRET_KEYRING_FILE: /run/secrets/mm_chat_provider_keyring
      REDIS_URL: ${REDIS_URL:-redis://:change-me-redis@redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mm-chat}
    secrets:
      - source: mm_chat_provider_keyring
        target: mm_chat_provider_keyring
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/usr/local/bin/mm-chat-memory-worker", "run"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mm-chat-memory-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - private

  agent-runtime-control:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: unless-stopped
    profiles: ["agent-runtime-control"]
    init: true
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    environment:
      AGENT_RUNNER_CONTROL_ENABLED: ${AGENT_RUNNER_CONTROL_ENABLED:-false}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
      AGENT_SCHEDULER_ENABLED: ${AGENT_SCHEDULER_ENABLED:-false}
      AGENT_SKILL_INSTALL_ENABLED: ${AGENT_SKILL_INSTALL_ENABLED:-false}
      AGENT_LEARNING_ENABLED: ${AGENT_LEARNING_ENABLED:-false}
      AGENT_DELEGATION_ENABLED: ${AGENT_DELEGATION_ENABLED:-false}
      AGENT_BROKER_READ_ONLY_ENABLED: ${AGENT_BROKER_READ_ONLY_ENABLED:-false}
      AGENT_BROKER_MUTATION_ENABLED: ${AGENT_BROKER_MUTATION_ENABLED:-false}
      AGENT_RUNNER_DATABASE_URL: ${AGENT_RUNNER_DATABASE_URL:-postgres://agent_runner_control_app:change-me-agent-control-postgres@postgres:5432/neo_chat?sslmode=disable}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-https://127.0.0.1:9443/internal/neo-runner/v1/rpc}
      AGENT_RUNNER_ID: ${AGENT_RUNNER_ID:-neo-runner-primary}
      AGENT_RUNNER_SERVER_NAME: ${AGENT_RUNNER_SERVER_NAME:-neo-runner.internal}
      AGENT_RUNNER_CLIENT_IDENTITY: ${AGENT_RUNNER_CLIENT_IDENTITY:-spiffe://neo-chat/agent-runtime-control}
      AGENT_RUNNER_CLIENT_CERT_FILE: /run/agent-runtime-control/client.crt
      AGENT_RUNNER_CLIENT_KEY_FILE: /run/agent-runtime-control/client.key
      AGENT_RUNNER_SERVER_CA_FILE: /run/agent-runtime-control/server-ca.crt
      AGENT_RUNNER_RELEASE_MANIFEST_FILE: /run/agent-runtime-control/release-manifest.json
      AGENT_PRODUCTION_POLICY_FILE: /etc/mm-chat/agent-runtime-control/production-policy.json
      AGENT_PRODUCTION_ACTIVATION_FILE: /run/agent-runtime-control/production-activation.json
      AGENT_RELEASE_GIT_COMMIT: ${AGENT_RELEASE_GIT_COMMIT:-0000000000000000000000000000000000000000}
      AGENT_RUNNER_POLL_INTERVAL: ${AGENT_RUNNER_POLL_INTERVAL:-30s}
      AGENT_RUNNER_RPC_TIMEOUT: ${AGENT_RUNNER_RPC_TIMEOUT:-10s}
      AGENT_RUNNER_RECONCILE_BATCH_SIZE: ${AGENT_RUNNER_RECONCILE_BATCH_SIZE:-100}
    volumes:
      - type: bind
        source: ${AGENT_RUNNER_CLIENT_CERT_SOURCE:-./secrets/agent-runtime-control/client.crt}
        target: /run/agent-runtime-control/client.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_RUNNER_CLIENT_KEY_SOURCE:-./secrets/agent-runtime-control/client.key}
        target: /run/agent-runtime-control/client.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_RUNNER_SERVER_CA_SOURCE:-./secrets/agent-runtime-control/server-ca.crt}
