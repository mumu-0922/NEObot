    networks: [private]

  agent-runtime-product-canary:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: unless-stopped
    profiles: ["agent-runtime-product-canary"]
    init: true
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 48
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    environment:
      AGENT_PRODUCT_CANARY_ENABLED: ${AGENT_PRODUCT_CANARY_ENABLED:-false}
      AGENT_RUNNER_CONTROL_ENABLED: ${AGENT_RUNNER_CONTROL_ENABLED:-false}
      AGENT_ROOT_RUN_CANARY_ENABLED: ${AGENT_ROOT_RUN_CANARY_ENABLED:-false}
      AGENT_BROKER_ARTIFACT_CANARY_ENABLED: ${AGENT_BROKER_ARTIFACT_CANARY_ENABLED:-false}
      AGENT_PROJECT_MUTATION_CANARY_ENABLED: ${AGENT_PROJECT_MUTATION_CANARY_ENABLED:-false}
      AGENT_CHILD_CANARY_ENABLED: ${AGENT_CHILD_CANARY_ENABLED:-false}
      AGENT_CRON_WORKER_ENABLED: ${AGENT_CRON_WORKER_ENABLED:-false}
      AGENT_DRAFT_LEARNING_WORKER_ENABLED: ${AGENT_DRAFT_LEARNING_WORKER_ENABLED:-false}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
      AGENT_SCHEDULER_ENABLED: ${AGENT_SCHEDULER_ENABLED:-false}
      AGENT_LEARNING_ENABLED: ${AGENT_LEARNING_ENABLED:-false}
      AGENT_SKILL_INSTALL_ENABLED: ${AGENT_SKILL_INSTALL_ENABLED:-false}
      AGENT_PRODUCT_CANARY_DATABASE_URL: ${AGENT_PRODUCT_CANARY_DATABASE_URL:-postgres://agent_product_canary_app:change-me-agent-product-canary-postgres@postgres:5432/neo_chat?sslmode=disable}
      AGENT_PRODUCT_CANARY_ACTIVATION_ID: ${AGENT_PRODUCT_CANARY_ACTIVATION_ID:-activation_0000000000000001}
      AGENT_PRODUCT_CANARY_RUNNER_URL: ${AGENT_PRODUCT_CANARY_RUNNER_URL:-https://127.0.0.1:9443/internal/neo-runner/v1/rpc}
      AGENT_PRODUCT_CANARY_RUNNER_ID: ${AGENT_PRODUCT_CANARY_RUNNER_ID:-neo-runner-primary}
      AGENT_PRODUCT_CANARY_SERVER_NAME: ${AGENT_PRODUCT_CANARY_SERVER_NAME:-neo-runner.internal}
      AGENT_PRODUCT_CANARY_CLIENT_IDENTITY: ${AGENT_PRODUCT_CANARY_CLIENT_IDENTITY:-spiffe://neo-chat/agent-runtime-product-canary}
      AGENT_PRODUCT_CANARY_CLIENT_CERT_FILE: /run/agent-runtime-product-canary/client.crt
      AGENT_PRODUCT_CANARY_CLIENT_KEY_FILE: /run/agent-runtime-product-canary/client.key
      AGENT_PRODUCT_CANARY_SERVER_CA_FILE: /run/agent-runtime-product-canary/server-ca.crt
      AGENT_PRODUCT_CANARY_RELEASE_MANIFEST_FILE: /run/agent-runtime-product-canary/release-manifest.json
      AGENT_PRODUCT_CANARY_PRODUCTION_POLICY_FILE: /etc/mm-chat/agent-runtime-product-canary/production-policy.json
      AGENT_PRODUCT_CANARY_ACTIVATION_FILE: /run/agent-runtime-product-canary/activation.json
      AGENT_PRODUCT_CANARY_PLAN_FILE: /run/agent-runtime-product-canary/plan.json
      AGENT_PRODUCT_CANARY_AUTHORITY_PRIVATE_KEY_FILE: /run/agent-runtime-product-canary/authority-private-key
      AGENT_PRODUCT_CANARY_AUTHORITY_PUBLIC_KEY_FILE: /run/agent-runtime-product-canary/authority-public-key
      AGENT_PRODUCT_CANARY_RELEASE_GIT_COMMIT: ${AGENT_PRODUCT_CANARY_RELEASE_GIT_COMMIT:-0000000000000000000000000000000000000000}
      AGENT_PRODUCT_CANARY_CLAIM_OWNER: ${AGENT_PRODUCT_CANARY_CLAIM_OWNER:-product-canary-worker-primary}
      AGENT_PRODUCT_CANARY_POLL_INTERVAL: ${AGENT_PRODUCT_CANARY_POLL_INTERVAL:-5s}
      AGENT_PRODUCT_CANARY_CLAIM_TTL: ${AGENT_PRODUCT_CANARY_CLAIM_TTL:-5m}
      AGENT_PRODUCT_CANARY_RPC_TIMEOUT: ${AGENT_PRODUCT_CANARY_RPC_TIMEOUT:-10s}
      AGENT_PRODUCT_CANARY_AUTHORITY_TTL: ${AGENT_PRODUCT_CANARY_AUTHORITY_TTL:-10s}
      AGENT_PRODUCT_CANARY_BATCH_SIZE: ${AGENT_PRODUCT_CANARY_BATCH_SIZE:-20}
    volumes:
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_CLIENT_CERT_SOURCE:-./secrets/agent-runtime-product-canary/client.crt}
        target: /run/agent-runtime-product-canary/client.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_CLIENT_KEY_SOURCE:-./secrets/agent-runtime-product-canary/client.key}
        target: /run/agent-runtime-product-canary/client.key
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_SERVER_CA_SOURCE:-./secrets/agent-runtime-product-canary/server-ca.crt}
        target: /run/agent-runtime-product-canary/server-ca.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_RELEASE_MANIFEST_SOURCE:-./secrets/agent-runtime-product-canary/release-manifest.json}
        target: /run/agent-runtime-product-canary/release-manifest.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_PRODUCTION_POLICY_SOURCE:-./config/agent-runner/production-policy.json}
        target: /etc/mm-chat/agent-runtime-product-canary/production-policy.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_ACTIVATION_SOURCE:-./secrets/agent-runtime-product-canary/activation.json}
        target: /run/agent-runtime-product-canary/activation.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_PLAN_SOURCE:-./secrets/agent-runtime-product-canary/plan.json}
        target: /run/agent-runtime-product-canary/plan.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_AUTHORITY_PRIVATE_KEY_SOURCE:-./secrets/agent-runtime-product-canary/authority-private-key}
        target: /run/agent-runtime-product-canary/authority-private-key
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_PRODUCT_CANARY_AUTHORITY_PUBLIC_KEY_SOURCE:-./secrets/agent-runtime-product-canary/authority-public-key}
        target: /run/agent-runtime-product-canary/authority-public-key
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      postgres: { condition: service_healthy }
    command: ["/usr/local/bin/mm-chat-agent-runtime-product-canary", "run"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mm-chat-agent-runtime-product-canary", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks: [private]

  frontend:
    image: ${FRONTEND_IMAGE:-mm-chat/frontend:local}
    build: *frontend-build
    restart: unless-stopped
    profiles: ["app"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: *frontend-env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0755,uid=1001,gid=1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - private

  rag-worker:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: unless-stopped
    profiles: ["rag-worker"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 448m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      RAG_WORKER_DATABASE_URL: ${RAG_WORKER_DATABASE_URL:-postgres://rag_worker:change-me-rag-worker-postgres@postgres:5432/neo_chat?sslmode=disable}
      RAG_WORKER_DISPATCH_ENABLED: ${RAG_WORKER_DISPATCH_ENABLED:-false}
      RAG_WORKER_JOB_STAGES: ${RAG_WORKER_JOB_STAGES:-}
      RAG_WORKER_REDIS_URL: ${REDIS_URL:-redis://:change-me-redis@redis:6379/0}
      RAG_MINERU_RESULT_PROXY_URL: ${RAG_MINERU_RESULT_PROXY_URL:-}
      RAG_SOURCE_GATEWAY_URL: ${RAG_SOURCE_GATEWAY_URL:-http://backend:8080}
      RAG_SOURCE_GATEWAY_TOKEN: ${RAG_SOURCE_GATEWAY_TOKEN:-}
      RAG_PROVIDER_PROFILE: ${RAG_PROVIDER_PROFILE:-disabled}
      RAG_PROVIDER_PROFILE_DRAFT_WIRE_ACCEPTED: ${RAG_PROVIDER_PROFILE_DRAFT_WIRE_ACCEPTED:-false}
      RAG_PROVIDER_RETRY_MAX_ATTEMPTS: ${RAG_PROVIDER_RETRY_MAX_ATTEMPTS:-3}
      RAG_PROVIDER_INITIAL_RETRY_SECONDS: ${RAG_PROVIDER_INITIAL_RETRY_SECONDS:-30}
      RAG_PROVIDER_MAX_RETRY_SECONDS: ${RAG_PROVIDER_MAX_RETRY_SECONDS:-300}
      RAG_PROVIDER_CONCURRENCY: ${RAG_PROVIDER_CONCURRENCY:-2}
      RAG_MINERU_REQUESTS_PER_MINUTE: ${RAG_MINERU_REQUESTS_PER_MINUTE:-60}
      RAG_SILICONFLOW_REQUESTS_PER_MINUTE: ${RAG_SILICONFLOW_REQUESTS_PER_MINUTE:-240}
      RAG_SILICONFLOW_EMBEDDING_MODEL: ${RAG_SILICONFLOW_EMBEDDING_MODEL:-Pro/BAAI/bge-m3}
      RAG_SILICONFLOW_RERANK_MODEL: ${RAG_SILICONFLOW_RERANK_MODEL:-Pro/BAAI/bge-reranker-v2-m3}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mm-chat}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - private
      - rag-private

  rag-replay:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["rag-ops"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 448m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      RAG_REPLAY_DATABASE_URL: ${RAG_REPLAY_DATABASE_URL:-postgres://rag_replay:change-me-rag-replay-postgres@postgres:5432/neo_chat?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["rag-replay"]
    networks:
      - rag-private

  parser-ipc-init:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        chown 10002:10001 /run/mm-chat-parser-ipc
        chmod 0770 /run/mm-chat-parser-ipc

  parser-sidecar:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "10002:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./rag/src/mm_chat_rag/offline_parser/profiles/parser-sidecar.json
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=10002,gid=10001
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    depends_on:
      parser-ipc-init:
        condition: service_completed_successfully
    entrypoint: ["parser-sidecar"]
    network_mode: none

  parser-harness-smoke:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 16
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /run/mm-chat-parser-harness:rw,noexec,nosuid,nodev,size=512m,nr_inodes=20000,mode=0700,uid=10001,gid=10001
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    depends_on:
      parser-sidecar:
        condition: service_started
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        count=0
        until [ -S /run/mm-chat-parser-ipc/parser.sock ]; do
          count=$$((count + 1))
          [ "$$count" -le 100 ] || exit 1
          sleep 0.1
        done
        exec parser-harness-smoke
    network_mode: none

  migrate:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: "no"
    profiles: ["ops"]
    environment:
      MM_CHAT_ADDR: ${MM_CHAT_ADDR:-:8080}
      MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://neo_chat_migrator:change-me-migrator-postgres@postgres:5432/neo_chat?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/usr/local/bin/mm-chat-migrate", "up"]
    networks:
      - private

  admin:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: "no"
    profiles: ["ops"]
    user: "${MM_CHAT_RUNTIME_UID:-1000}:${MM_CHAT_RUNTIME_GID:-1000}"
    environment:
      MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://neo_chat_api:change-me-api-postgres@postgres:5432/neo_chat?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      AUTH_BOOTSTRAP_USER_ID: ${AUTH_BOOTSTRAP_USER_ID:-00000000-0000-0000-0000-000000000001}
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-Owner}
      RAG_PROVIDER_PROFILE: ${RAG_PROVIDER_PROFILE:-disabled}
      RAG_PROVIDER_PROFILE_DRAFT_WIRE_ACCEPTED: ${RAG_PROVIDER_PROFILE_DRAFT_WIRE_ACCEPTED:-false}
      PROVIDER_SECRET_KEYRING_FILE: /run/secrets/mm_chat_provider_keyring
      BYOK_PRIVATE_KEY_PEM: ${BYOK_PRIVATE_KEY_PEM:-}
      BYOK_KEY_ID: ${BYOK_KEY_ID:-}
      BYOK_ALLOW_EPHEMERAL_KEY: "false"
    secrets:
      - source: mm_chat_provider_keyring
        target: mm_chat_provider_keyring
    volumes:
      - ./backup:/backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/mm-chat-admin"]
    networks:
      - private

  minio-client:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["ops"]
    environment:
      <<: [*minio-root-env, *minio-app-env]
    volumes:
      - ./backup/minio:/backup
    networks:
      - private

networks:
  private:
    driver: bridge
  agent-broker-relay:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${AGENT_BROKER_CANARY_RELAY_SUBNET:-172.31.254.0/29}
  agent-project-relay:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${AGENT_PROJECT_CANARY_RELAY_SUBNET:-172.31.254.8/29}
  rag-private:
    driver: bridge
    internal: true
  mcp-control:
    driver: bridge
    internal: true
  mcp-egress:
    driver: bridge

volumes:
  parser-ipc:

secrets:
  mm_chat_provider_keyring:
    file: ${PROVIDER_SECRET_KEYRING_SOURCE:-./secrets/provider-keyring.json}
  mm_chat_mcp_runner_token:
    file: ${MCP_RUNNER_TOKEN_SOURCE:-./mcp/runner-token.disabled}
  mm_chat_mcp_marketplace_client_secret:
    file: ${MCP_MARKETPLACE_CLIENT_SECRET_SOURCE:-./mcp/marketplace-client-secret.disabled}
