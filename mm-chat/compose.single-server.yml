    command: ["/usr/local/bin/mm-chat-agent-runtime-draft-learning-worker", "run"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mm-chat-agent-runtime-draft-learning-worker", "healthcheck"]
      interval: 30s
      timeout: 30s
