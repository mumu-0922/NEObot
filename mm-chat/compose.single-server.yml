        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AGENT_CHILD_CANARY_ACTIVATION_SOURCE:-./secrets/agent-runtime-child-canary/production-activation.json}
        target: /run/agent-runtime-draft-learning-worker/prerequisite-child.json
