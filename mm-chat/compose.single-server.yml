name: mm-chat

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-rag-build: &rag-build
  context: ./rag
  dockerfile: Dockerfile

x-frontend-build: &frontend-build
  context: ./frontend
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_API_MODE: server
    NEXT_PUBLIC_API_BASE_URL: /mm-api
    MM_CHAT_BACKEND_INTERNAL_URL: http://backend:8080

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-neo_chat}
  POSTGRES_USER: ${POSTGRES_USER:-neo_chat_migrator}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-migrator-postgres}

x-redis-env: &redis-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}

x-minio-root-env: &minio-root-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-root}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-root-secret}

x-minio-app-env: &minio-app-env
  S3_BUCKET: ${S3_BUCKET:-neo-chat-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mm-chat-files}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-user-secret}

x-frontend-env: &frontend-env
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_API_MODE: server
  NEXT_PUBLIC_API_BASE_URL: /mm-api
  MM_CHAT_BACKEND_INTERNAL_URL: http://backend:8080
  BYOK_PRIVATE_KEY_PEM: ${BYOK_PRIVATE_KEY_PEM:-}
  BYOK_KEY_ID: ${BYOK_KEY_ID:-}
  BYOK_ALLOW_EPHEMERAL_KEY: ${BYOK_ALLOW_EPHEMERAL_KEY:-true}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
  ALLOW_LOCAL_NETWORK_PROXY: ${ALLOW_LOCAL_NETWORK_PROXY:-}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
  DOCUMENT_PARSE_JOB_STORE: ${DOCUMENT_PARSE_JOB_STORE:-memory}
  PLUGIN_REGISTRY_STORE: ${PLUGIN_REGISTRY_STORE:-memory}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
  DEFAULT_PROVIDER_TYPE: ${PROVIDER_TYPE:-openai_compatible}
  DEFAULT_PROVIDER_NAME: ${DEFAULT_PROVIDER_NAME:-Server Default}
  DEFAULT_PROVIDER_MODELS: ${PROVIDER_MODEL:-gpt-5.5}

x-backend-env: &backend-env
  MM_CHAT_ADDR: ${MM_CHAT_ADDR:-:8080}
  MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
  DATABASE_URL: ${DATABASE_URL:-postgres://neo_chat_api:change-me-api-postgres@postgres:5432/neo_chat?sslmode=disable}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
  REDIS_URL: ${REDIS_URL:-redis://:change-me-redis@redis:6379/0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mm-chat}
  REDIS_RUN_CANCEL_TTL: ${REDIS_RUN_CANCEL_TTL:-10m}
  REDIS_SESSION_CACHE_TTL: ${REDIS_SESSION_CACHE_TTL:-5m}
  REDIS_RATE_LIMIT_ENABLED: ${REDIS_RATE_LIMIT_ENABLED:-true}
  REDIS_RATE_LIMIT_REQUESTS: ${REDIS_RATE_LIMIT_REQUESTS:-120}
  REDIS_RATE_LIMIT_WINDOW: ${REDIS_RATE_LIMIT_WINDOW:-1m}
  AUTH_MODE: ${AUTH_MODE:-required}
  AUTH_BOOTSTRAP_USER_ID: ${AUTH_BOOTSTRAP_USER_ID:-00000000-0000-0000-0000-000000000001}
  AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-Owner}
  AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
  AUTH_RECOVERY_TTL: ${AUTH_RECOVERY_TTL:-30m}
  AUTH_SMTP_ADDR: ${AUTH_SMTP_ADDR:-}
  AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
  AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
  AUTH_SMTP_FROM: ${AUTH_SMTP_FROM:-}
  AUTH_SMTP_QUEUE_SIZE: ${AUTH_SMTP_QUEUE_SIZE:-100}
  AUTH_SMTP_TIMEOUT: ${AUTH_SMTP_TIMEOUT:-10s}
  TEAM_CURSOR_ACTIVE_KEY_ID: ${TEAM_CURSOR_ACTIVE_KEY_ID:-}
  TEAM_CURSOR_KEYRING: "${TEAM_CURSOR_KEYRING:-}"
  TEAM_MAIL_ACTIVE_KEY_ID: ${TEAM_MAIL_ACTIVE_KEY_ID:-}
  TEAM_MAIL_KEYRING: "${TEAM_MAIL_KEYRING:-}"
  TEAM_INVITE_ACCEPT_URL_BASE: ${TEAM_INVITE_ACCEPT_URL_BASE:-}
  TEAM_MAIL_WORKER_LEASE_DURATION: ${TEAM_MAIL_WORKER_LEASE_DURATION:-30s}
  TEAM_MAIL_WORKER_POLL_INTERVAL: ${TEAM_MAIL_WORKER_POLL_INTERVAL:-500ms}
  TEAM_MAIL_WORKER_BACKOFF_BASE: ${TEAM_MAIL_WORKER_BACKOFF_BASE:-5s}
  TEAM_MAIL_WORKER_BACKOFF_MAX: ${TEAM_MAIL_WORKER_BACKOFF_MAX:-15m}
  PROVIDER_TYPE: ${PROVIDER_TYPE:-openai_compatible}
  PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://your-openai-compatible-relay.example/v1}
  PROVIDER_MODEL: ${PROVIDER_MODEL:-gpt-5.5}
  PROVIDER_API_KEY: ${PROVIDER_API_KEY:-change-me-provider-key}
  PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-2m}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-./data/files}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-neo-chat-files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mm-chat-files}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-user-secret}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_BUCKET_AUTO_CREATE: ${S3_BUCKET_AUTO_CREATE:-false}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
      - rag-private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment: *redis-env
    command:
      - sh
      - -euc
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private
      - rag-private

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    environment: *minio-root-env
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - private

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    environment:
      <<: [*minio-root-env, *minio-app-env]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio" >&2
          sleep 2
        done

        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/mm-chat-files-policy.json <<EOF_POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject"
              ],
              "Resource": [
                "arn:aws:s3:::$$S3_BUCKET",
                "arn:aws:s3:::$$S3_BUCKET/*"
              ]
            }
          ]
        }
        EOF_POLICY
        if ! mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"; then
          mc admin user enable local "$$S3_ACCESS_KEY_ID"
        fi

        if ! mc admin policy create local mm-chat-files /tmp/mm-chat-files-policy.json; then
          mc admin policy info local mm-chat-files >/dev/null
        fi
        mc admin policy attach local mm-chat-files --user "$$S3_ACCESS_KEY_ID"

        mc alias set app http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null
        printf 'mm-chat init check' > /tmp/mm-chat-init-check.txt
        mc cp /tmp/mm-chat-init-check.txt "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
        mc stat "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
        mc rm "app/$$S3_BUCKET/.mm-chat-init-check" >/dev/null
    networks:
      - private

  backend:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: unless-stopped
    profiles: ["app"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - private

  frontend:
    image: ${FRONTEND_IMAGE:-mm-chat/frontend:local}
    build: *frontend-build
    restart: unless-stopped
    profiles: ["app"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: *frontend-env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0755,uid=1001,gid=1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - private

  rag-worker:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: unless-stopped
    profiles: ["rag-worker"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 448m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      RAG_WORKER_DATABASE_URL: ${RAG_WORKER_DATABASE_URL:-postgres://rag_worker:change-me-rag-worker-postgres@postgres:5432/neo_chat?sslmode=disable}
      RAG_WORKER_DISPATCH_ENABLED: ${RAG_WORKER_DISPATCH_ENABLED:-false}
      RAG_WORKER_JOB_STAGES: ${RAG_WORKER_JOB_STAGES:-}
      RAG_WORKER_REDIS_URL: ${REDIS_URL:-redis://:change-me-redis@redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mm-chat}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - rag-private

  rag-replay:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["rag-ops"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 448m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      RAG_REPLAY_DATABASE_URL: ${RAG_REPLAY_DATABASE_URL:-postgres://rag_replay:change-me-rag-replay-postgres@postgres:5432/neo_chat?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["rag-replay"]
    networks:
      - rag-private

  parser-ipc-init:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        chown 10002:10001 /run/mm-chat-parser-ipc
        chmod 0770 /run/mm-chat-parser-ipc

  parser-sidecar:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "10002:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./rag/src/mm_chat_rag/offline_parser/profiles/parser-sidecar.json
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=10002,gid=10001
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    depends_on:
      parser-ipc-init:
        condition: service_completed_successfully
    entrypoint: ["parser-sidecar"]
    network_mode: none

  parser-harness-smoke:
    image: ${RAG_IMAGE:-mm-chat/rag:local}
    build: *rag-build
    restart: "no"
    profiles: ["parser-c1"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 16
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /run/mm-chat-parser-harness:rw,noexec,nosuid,nodev,size=512m,nr_inodes=20000,mode=0700,uid=10001,gid=10001
    volumes:
      - parser-ipc:/run/mm-chat-parser-ipc
    depends_on:
      parser-sidecar:
        condition: service_started
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        count=0
        until [ -S /run/mm-chat-parser-ipc/parser.sock ]; do
          count=$$((count + 1))
          [ "$$count" -le 100 ] || exit 1
          sleep 0.1
        done
        exec parser-harness-smoke
    network_mode: none

  migrate:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: "no"
    profiles: ["ops"]
    environment:
      MM_CHAT_ADDR: ${MM_CHAT_ADDR:-:8080}
      MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://neo_chat_migrator:change-me-migrator-postgres@postgres:5432/neo_chat?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/usr/local/bin/mm-chat-migrate", "up"]
    networks:
      - private

  admin:
    image: ${BACKEND_IMAGE:-mm-chat/backend:local}
    build: *backend-build
    restart: "no"
    profiles: ["ops"]
    environment:
      MM_CHAT_VERSION: ${MM_CHAT_VERSION:-single-server-dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://neo_chat_api:change-me-api-postgres@postgres:5432/neo_chat?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      AUTH_BOOTSTRAP_USER_ID: ${AUTH_BOOTSTRAP_USER_ID:-00000000-0000-0000-0000-000000000001}
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-Owner}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/mm-chat-admin"]
    networks:
      - private

  minio-client:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["ops"]
    environment:
      <<: [*minio-root-env, *minio-app-env]
    volumes:
      - ./backup/minio:/backup
    networks:
      - private

networks:
  private:
    driver: bridge
  rag-private:
    driver: bridge
    internal: true

volumes:
  parser-ipc:
