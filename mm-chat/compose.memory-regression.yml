services:
  memory-regression-postgres:
    image: mm-chat/postgres:17.10-pg_textsearch1.3.1-pgvector0.8.5
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 192
    environment:
      POSTGRES_DB: mm_chat_memory_regression_runtime
      POSTGRES_USER: memory_regression_admin
      POSTGRES_PASSWORD: ${MEMORY_REGRESSION_DB_PASSWORD:?ephemeral database password is required}
    volumes:
      - memory-regression-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U memory_regression_admin -d mm_chat_memory_regression_runtime
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks:
      - memory-regression-private

  memory-regression-migrate:
    image: mm-chat/memory-regression-capture:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: memory-regression-capture
    restart: "no"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 48
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    environment:
      MIGRATION_DATABASE_URL: postgresql://memory_regression_admin:${MEMORY_REGRESSION_DB_PASSWORD:?ephemeral database password is required}@memory-regression-postgres:5432/mm_chat_memory_regression_runtime?sslmode=disable
    entrypoint:
      - /usr/local/bin/mm-chat-migrate
    command:
      - up
    depends_on:
      memory-regression-postgres:
        condition: service_healthy
    networks:
      - memory-regression-private

  memory-regression-fake-runner:
    image: mm-chat/memory-regression-capture:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: memory-regression-capture
    profiles: ["memory-regression-fake"]
    restart: "no"
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment: &capture-environment
      MM_CHAT_MEMORY_REGRESSION_ADMIN_DATABASE_URL: postgresql://memory_regression_admin:${MEMORY_REGRESSION_DB_PASSWORD:?ephemeral database password is required}@memory-regression-postgres:5432/mm_chat_memory_regression_runtime?sslmode=disable
      MM_CHAT_MEMORY_REGRESSION_RUNTIME_DATABASE_URL: postgresql://memory_regression_admin:${MEMORY_REGRESSION_DB_PASSWORD:?ephemeral database password is required}@memory-regression-postgres:5432/mm_chat_memory_regression_runtime?sslmode=disable&role=go_api_runtime
    volumes:
      - type: bind
        source: ${MEMORY_REGRESSION_ROOT_PATH:?protected regression root is required}
        target: /fixtures/regression
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_COST_BASIS_PATH:?cost basis path is required}
        target: /inputs/cost-basis.json
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_OUTPUT_PATH:?private output path is required}
        target: /output
    entrypoint:
      - /usr/local/bin/mm-chat-memory-regression-capture
    command:
      - -root
      - /fixtures/regression
      - -output-dir
      - /output
      - -cost-basis
      - /inputs/cost-basis.json
      - -provider-mode
      - fake_protocol
      - -capture-mode
      - ${MEMORY_REGRESSION_CAPTURE_MODE:?capture mode is required}
      - -run-id
      - ${MEMORY_REGRESSION_RUN_ID:?run ID is required}
      - -cloud-judge-model
      - ${MEMORY_REGRESSION_CLOUD_JUDGE_MODEL:-Qwen/Qwen3-8B}
      - -memory-tool-route-provider-id
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_ID:-}"
      - -memory-tool-route-provider-type
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_TYPE:-}"
      - -memory-tool-route-base-url
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_BASE_URL:-}"
      - -memory-tool-route-model
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_MODEL:-}"
      - -configured-candidate-judge-provider-id
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_ID:-}"
      - -configured-candidate-judge-provider-type
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_TYPE:-}"
      - -configured-candidate-judge-base-url
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_BASE_URL:-}"
      - -configured-candidate-judge-model
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_MODEL:-}"
    depends_on:
      memory-regression-postgres:
        condition: service_healthy
    networks:
      - memory-regression-private

  memory-regression-live-runner:
    image: mm-chat/memory-regression-capture:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: memory-regression-capture
    profiles: ["memory-regression-live"]
    restart: "no"
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      <<: *capture-environment
      MM_CHAT_MEMORY_REGRESSION_LIVE_ENABLED: "true"
      MM_CHAT_MEMORY_REGRESSION_LIVE_APPROVAL: ${MEMORY_REGRESSION_LIVE_APPROVAL:?live approval is required}
      MM_CHAT_MEMORY_REGRESSION_LIVE_RUN_ID: ${MEMORY_REGRESSION_RUN_ID:?run ID is required}
      MM_CHAT_MEMORY_REGRESSION_LIVE_PROVIDER_ID: siliconflow
      MM_CHAT_MEMORY_REGRESSION_LIVE_EMBEDDING_MODEL_ID: Pro/BAAI/bge-m3
      MM_CHAT_MEMORY_REGRESSION_LIVE_RERANK_MODEL_ID: Pro/BAAI/bge-reranker-v2-m3
      MM_CHAT_MEMORY_REGRESSION_LIVE_CLOUD_JUDGE_MODEL_ID: ${MEMORY_REGRESSION_CLOUD_JUDGE_MODEL:-Qwen/Qwen3-8B}
      MM_CHAT_MEMORY_REGRESSION_LIVE_MEMORY_TOOL_ROUTE_APPROVAL: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_APPROVAL:-NOT_AUTHORIZED}
      MM_CHAT_MEMORY_REGRESSION_LIVE_MEMORY_TOOL_ROUTE_PROVIDER_ID: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_ID:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_MEMORY_TOOL_ROUTE_PROVIDER_TYPE: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_TYPE:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_MEMORY_TOOL_ROUTE_BASE_URL_SHA256: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_BASE_URL_SHA256:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_MEMORY_TOOL_ROUTE_MODEL_ID: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_MODEL:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_CONFIGURED_CANDIDATE_JUDGE_APPROVAL: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_APPROVAL:-NOT_AUTHORIZED}
      MM_CHAT_MEMORY_REGRESSION_LIVE_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_ID: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_ID:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_TYPE: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_TYPE:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_CONFIGURED_CANDIDATE_JUDGE_BASE_URL_SHA256: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_BASE_URL_SHA256:-}
      MM_CHAT_MEMORY_REGRESSION_LIVE_CONFIGURED_CANDIDATE_JUDGE_MODEL_ID: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_MODEL:-}
    volumes:
      - type: bind
        source: ${MEMORY_REGRESSION_ROOT_PATH:?protected regression root is required}
        target: /fixtures/regression
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_COST_BASIS_PATH:?cost basis path is required}
        target: /inputs/cost-basis.json
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_CREDENTIAL_PATH:?credential path is required}
        target: /run/mm-chat-memory-regression/provider.key
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_CREDENTIAL_PATH:?Memory Tool-route credential path is required}
        target: /run/mm-chat-memory-regression/memory-tool-route-provider.key
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_CREDENTIAL_PATH:?configured candidate-judge credential path is required}
        target: /run/mm-chat-memory-regression/configured-candidate-judge-provider.key
        read_only: true
      - type: bind
        source: ${MEMORY_REGRESSION_OUTPUT_PATH:?private output path is required}
        target: /output
    entrypoint:
      - /usr/local/bin/mm-chat-memory-regression-capture
    command:
      - -root
      - /fixtures/regression
      - -output-dir
      - /output
      - -cost-basis
      - /inputs/cost-basis.json
      - -provider-mode
      - live_siliconflow
      - -capture-mode
      - ${MEMORY_REGRESSION_CAPTURE_MODE:?capture mode is required}
      - -run-id
      - ${MEMORY_REGRESSION_RUN_ID:?run ID is required}
      - -credential-file
      - /run/mm-chat-memory-regression/provider.key
      - -cloud-judge-model
      - ${MEMORY_REGRESSION_CLOUD_JUDGE_MODEL:-Qwen/Qwen3-8B}
      - -memory-tool-route-credential-file
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_CREDENTIAL_TARGET:-}"
      - -memory-tool-route-provider-id
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_ID:-}"
      - -memory-tool-route-provider-type
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_PROVIDER_TYPE:-}"
      - -memory-tool-route-base-url
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_BASE_URL:-}"
      - -memory-tool-route-model
      - "${MEMORY_REGRESSION_MEMORY_TOOL_ROUTE_MODEL:-}"
      - -configured-candidate-judge-credential-file
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_CREDENTIAL_TARGET:-}"
      - -configured-candidate-judge-provider-id
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_ID:-}"
      - -configured-candidate-judge-provider-type
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_PROVIDER_TYPE:-}"
      - -configured-candidate-judge-base-url
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_BASE_URL:-}"
      - -configured-candidate-judge-model
      - "${MEMORY_REGRESSION_CONFIGURED_CANDIDATE_JUDGE_MODEL:-}"
    depends_on:
      memory-regression-postgres:
        condition: service_healthy
    networks:
      - memory-regression-private
      - memory-regression-egress

networks:
  memory-regression-private:
    internal: true
  memory-regression-egress: {}

volumes:
  memory-regression-postgres-data:
