[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mm-chat-rag"
version = "0.1.0"
description = "Durable dark-run RAG worker for MM Chat"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "httpx==0.28.1",
  "markdown-it-py==4.2.0",
  "prometheus-client==0.22.1",
  "psycopg[binary,pool]==3.2.9",
  "redis==6.2.0",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[project.scripts]
rag-worker = "mm_chat_rag.worker:main"
rag-replay = "mm_chat_rag.replay:main"
parser-sidecar = "mm_chat_rag.offline_parser.sidecar:main"
parser-harness-smoke = "mm_chat_rag.offline_parser.smoke:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==1.16.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==6.2.1",
  "rfc8785==0.1.4",
  "ruff==0.12.2",
  "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mm_chat_rag"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C901",
  "COM812",
  "D102",
  "D105",
  "D107",
  "D203",
  "D212",
  "D213",
  "EM101",
  "EM102",
  "FBT001",
  "PLR0912",
  "PLR0913",
  "S104",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG001",
  "ARG002",
  "ASYNC109",
  "D",
  "FBT002",
  "FBT003",
  "PLR2004",
  "PYI034",
  "S101",
  "S105",
  "SLF001",
  "TRY301",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["mm_chat_rag"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an explicit RAG_TEST_* DSN",
]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["mm_chat_rag"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
