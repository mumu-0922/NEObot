name: Bug report
description: Report a reproducible problem in MM Chat.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never post API keys, passwords, private logs, database dumps, object archives, or user files.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reproducible path.
      placeholder: |
        1. Start ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend
        - Backend/API
        - Knowledge/RAG
        - PostgreSQL/storage
        - Docker/deployment
        - Unknown/cross-layer
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, commit/version, deployment mode, and relevant tool versions.
      placeholder: |
        Browser:
        OS:
        Commit/version:
        Deployment: Docker Compose / direct development
        Node/pnpm, Go, Python/uv, Docker versions:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, private content, UUIDs, and object keys.
      render: shell
