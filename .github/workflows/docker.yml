name: Docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: mm-chat/backend
            suffix: ""
            build_args: ""
          - component: frontend
            context: mm-chat/frontend
            suffix: -frontend
            build_args: |
              NEXT_PUBLIC_API_MODE=server
              NEXT_PUBLIC_API_BASE_URL=/mm-api
              MM_CHAT_BACKEND_INTERNAL_URL=http://backend:8080
          - component: rag
            context: mm-chat/rag
            suffix: -rag
            build_args: ""
          - component: postgres
            context: mm-chat/postgres
            suffix: -postgres
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neobot-mm-chat"
          echo "name=${base}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
